name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Refresh the hurricane / uncrewed-asset map hourly. Public repos get
  # unlimited Actions minutes, and nothing is committed — the data is
  # fetched into the build, so the repo does not grow with each refresh.
  # Offset from the hour because scheduled runs bunch up at :00.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Gate. Nothing reaches Pages unless this passes: type errors, a broken
  # map or clock, and docs that no longer match the repo all stop the deploy
  # rather than shipping. Runs against the committed data snapshot, so it
  # needs no network beyond npm and cannot fail on an upstream outage.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Never fail the deploy over an upstream outage: the script keeps the
      # committed snapshot when a source is unreachable.
      - name: Refresh ocean asset data
        continue-on-error: true
        run: python3 scripts/fetch-ocean-assets.py

      - name: Refresh surface current field
        continue-on-error: true
        run: python3 scripts/fetch-currents.py

      - name: Refresh sea surface temperature and salinity
        continue-on-error: true
        run: python3 scripts/fetch-ocean-fields.py

      # Every refresh above is continue-on-error, so an outage degrades to the
      # committed snapshot rather than blocking a deploy. What must not pass
      # silently is data that arrived in the wrong *shape* — that is how the
      # ERDDAP empty-field drift produced grids shifted west, and how a stale
      # model run was served for two days while the build reported success.
      # `verify` runs before these steps and only ever sees the snapshot, so
      # this is the one place fresh upstream drift can be caught.
      - name: Check the refreshed data against the published contract
        run: npm run test:schema

      # The full-resolution tiles are ~92 MB per depth and only change when
      # the model does, which is once a day at 12Z. Keying the cache on the
      # run id means the hourly builds restore them instead of pulling them
      # from HYCOM's public server twenty-four times over. Both depths share
      # one cache entry, so a partial tile run is never half-restored.
      - name: Identify the model run
        id: model
        continue-on-error: true
        run: echo "run=$(python3 scripts/fetch-currents.py --run)" >> "$GITHUB_OUTPUT"

      - name: Restore full-resolution current tiles
        id: tiles
        if: steps.model.outputs.run != ''
        uses: actions/cache@v4
        with:
          path: |
            public/map/tiles
            public/map/tiles-60m
            public/map/tiles-f24h
            public/map/tiles-60m-f24h
          # v3: a tile set per forecast hour joins the cache, so a v2 hit
          # would restore only the present and leave the +24h layer coarse
          # while every check stayed green.
          key: currents-tiles-v3-${{ steps.model.outputs.run }}

      - name: Build full-resolution current tiles
        if: steps.model.outputs.run != '' && steps.tiles.outputs.cache-hit != 'true'
        continue-on-error: true
        run: python3 scripts/fetch-currents.py --tiles

      # Navy SST tiles, keyed on the same model run — they come from the same
      # forecast, so they go stale together. OISST has no tile tier: its
      # regional grids are already at its native 1/4 degree.
      - name: Restore Navy field tiles
        id: ssttiles
        if: steps.model.outputs.run != ''
        uses: actions/cache@v4
        with:
          path: |
            public/map/tiles-sst-navy
            public/map/tiles-sss-navy
            public/map/tiles-sst-navy-f24h
            public/map/tiles-sss-navy-f24h
          # v2: the tile geometry is unchanged but the index's minZoom is not,
          # and a cache hit would keep publishing the old threshold.
          # v3: salinity tiles join the set, so a v2 hit would restore an
          # incomplete one and skip building the new half.
          # v4: same reason as the currents cache above.
          key: field-tiles-v4-${{ steps.model.outputs.run }}

      - name: Build Navy field tiles
        if: steps.model.outputs.run != '' && steps.ssttiles.outputs.cache-hit != 'true'
        continue-on-error: true
        run: python3 scripts/fetch-ocean-fields.py --tiles

      - uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
