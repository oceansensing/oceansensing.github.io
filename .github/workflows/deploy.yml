name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Hourly, still: the storm status line above the map is rendered at build
  # time, so only a real rebuild refreshes it. The map's *data* no longer
  # comes from here — see MAP_DATA in src/config.ts — so this run is now
  # cheap. Offset from the hour because scheduled runs bunch up at :00.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Gate. Nothing reaches Pages unless this passes: type errors, a broken
  # map or clock, and docs that no longer match the repo all stop the deploy
  # rather than shipping. Runs against the committed data snapshot, so it
  # needs no network beyond npm and cannot fail on an upstream outage.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No data steps. The map reads its own repository now — see MAP_DATA in
      # src/config.ts — which fetches on its own schedule at :05 and publishes
      # to its own Pages site. This build is the site and nothing else: no
      # Python, no tile cache, and a deploy that takes a minute rather than
      # twenty.
      #
      # The cost is a dependency on a second origin being up. That is visible
      # to a reader as a map with no data rather than as a broken page, and
      # the data repository's own workflow gates on the same schema check
      # this one used to run.
      - uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
